name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS Build (unsigned ipa)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mxenc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "file=$(echo "$RAW" | tr '+' '-')" >> "$GITHUB_OUTPUT"
          echo "IPA 版本: $RAW"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Install Rust toolchain (iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust core (aarch64-apple-ios)
        working-directory: mxenc/rust_core
        run: |
          cargo build --lib --release --target aarch64-apple-ios
          mkdir -p ../ios/libs
          cp target/aarch64-apple-ios/release/libmxenc_core.a ../ios/libs/
          ls -lh ../ios/libs/libmxenc_core.a

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          mv Runner.app Payload/
          zip -qry -9 "MxEnc_${{ steps.version.outputs.file }}.ipa" Payload
          ls -lh "MxEnc_${{ steps.version.outputs.file }}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MxEnc-${{ steps.version.outputs.file }}
          path: mxenc/build/ios/iphoneos/MxEnc_*.ipa
          if-no-files-found: error
