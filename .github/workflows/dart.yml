name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    # 设置全局默认工作目录，这样后续的大部分步骤都不用重复写 working-directory
    defaults:
      run:
        working-directory: mxenc

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust core for iOS
        run: |
          chmod +x scripts/build_rust.sh
          ./scripts/build_rust.sh

      - name: Setup and generate symbols
        run: |
          cd rust_core
          # 确保 Cargo.toml 配置正确
          if ! grep -q "crate-type.*staticlib" Cargo.toml; then
            echo "Updating Cargo.toml to include staticlib..."
            sed -i 's/crate-type = \[.*/crate-type = ["staticlib", "cdylib", "rlib"]/' Cargo.toml
          fi
          
          # 检查符号列表文件是否存在
          if [ ! -f "ios_exported_symbols.txt" ]; then
            echo "_frb_get_rust_content_hash" > ios_exported_symbols.txt
            echo "_store_dart_post_cobject" >> ios_exported_symbols.txt
            echo "_frb_init_frb_dart_api_dl" >> ios_exported_symbols.txt
            echo "_dummy_method_to_enforce_bundling" >> ios_exported_symbols.txt
          fi

      - name: Build and auto-fix missing symbols
        run: |
          cd rust_core
          
          MAX_ITERATIONS=5
          for i in $(seq 1 $MAX_ITERATIONS); do
            echo "=== 编译尝试 $i/$MAX_ITERATIONS ==="
            
            # 使用 --lib 编译并捕获输出
            if cargo build --lib --release --target aarch64-apple-ios 2>&1 | tee /tmp/build.log; then
              echo "✅ Rust 编译成功！"
              break
            fi
            
            echo "⚠️ 编译失败，分析是否有缺失符号..."
            # 从错误信息中提取 Undefined symbols
            MISSING=$(grep "Undefined symbols" -A 100 /tmp/build.log | grep '  "_' | sed 's/.*"_/_/' | sed 's/".*//' | grep -v "referenced from" | sort -u)
            
            if [ -z "$MISSING" ]; then
              echo "❌ 编译失败但未发现明显的缺失符号，可能是其他代码错误"
              cat /tmp/build.log
              exit 1
            fi
            
            echo "发现缺失符号并自动补齐："
            echo "$MISSING"
            
            # 添加到符号列表
            echo "$MISSING" >> ios_exported_symbols.txt
            sort -u ios_exported_symbols.txt -o ios_exported_symbols.txt
            
            echo "=== 当前 ios_exported_symbols.txt 状态 ==="
            cat ios_exported_symbols.txt
          done
          
          # 拷贝最终产物到 ios 目录 (如果脚本没做)
          mkdir -p ../ios/libs
          cp target/aarch64-apple-ios/release/libmxenc_core.a ../ios/libs/

      - name: Update Pods
        run: pod repo update
        working-directory: mxenc/ios

      - name: Build iOS
        run: |
          export FLUTTER_ROOT="$FLUTTER_ROOT"
          flutter build ios --release --no-codesign

      - name: Verify final binary symbols
        run: |
          echo "=== 最终 iOS 打包产物符号检查 ==="
          nm -g build/ios/iphoneos/Runner.app/Runner | grep -E "(_frb|_wire|_dummy)" | head -20 || echo "警告：最终产物中未发现关键符号"

      - name: Prepare IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app/ Payload
          zip -qq -r -9 "MxEnc_${{ steps.get_version.outputs.TAG_NAME }}.ipa" Payload

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: mxenc/build/ios/iphoneos/MxEnc_${{ steps.get_version.outputs.TAG_NAME }}.ipa
          asset_name: MxEnc_${{ steps.get_version.outputs.TAG_NAME }}.ipa
          tag: ${{ steps.get_version.outputs.TAG_NAME }}
          overwrite: true
          body: "Release ${{ steps.get_version.outputs.TAG_NAME }} built from mxenc directory"
