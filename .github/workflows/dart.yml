name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    # 设置全局默认工作目录，这样后续的大部分步骤都不用重复写 working-directory
    defaults:
      run:
        working-directory: mxenc

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust core for iOS
        run: |
          chmod +x scripts/build_rust.sh
          ./scripts/build_rust.sh

      - name: Verify symbols in Rust library
        run: |
          cd rust_core
          echo "=== 查找所有 FRB 符号 ==="
          nm -g target/aarch64-apple-ios/release/libmxenc_core.a | grep " T _frb" || true
          
          echo "=== 验证关键符号 ==="
          for symbol in frb_get_rust_content_hash store_dart_post_cobject frb_init_frb_dart_api_dl dummy_method_to_enforce_bundling frb_dart_opaque_new; do
            if nm -g target/aarch64-apple-ios/release/libmxenc_core.a | grep -q "_${symbol}"; then
              echo "✅ ${symbol}"
            else
              echo "❌ ${symbol} NOT FOUND"
              exit 1
            fi
          done

      - name: Update Pods
        run: pod repo update
        working-directory: mxenc/ios

      - name: Build iOS
        run: |
          export FLUTTER_ROOT="$FLUTTER_ROOT"
          flutter build ios --release --no-codesign

      - name: Verify symbols in iOS binary
        run: |
          echo "=== 查找所有 FRB 符号 ==="
          nm -g build/ios/iphoneos/Runner.app/Runner | grep " T _frb" || true
          
          echo "=== 验证关键符号 ==="
          for symbol in frb_get_rust_content_hash store_dart_post_cobject frb_init_frb_dart_api_dl dummy_method_to_enforce_bundling frb_dart_opaque_new; do
            if nm -g build/ios/iphoneos/Runner.app/Runner | grep -q "_${symbol}"; then
              echo "✅ ${symbol}"
            else
              echo "❌ ${symbol} NOT FOUND IN FINAL BINARY"
              exit 1
            fi
          done

      - name: Prepare IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app/ Payload
          zip -qq -r -9 "MxEnc_${{ steps.get_version.outputs.TAG_NAME }}.ipa" Payload

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: mxenc/build/ios/iphoneos/MxEnc_${{ steps.get_version.outputs.TAG_NAME }}.ipa
          asset_name: MxEnc_${{ steps.get_version.outputs.TAG_NAME }}.ipa
          tag: ${{ steps.get_version.outputs.TAG_NAME }}
          overwrite: true
          body: "Release ${{ steps.get_version.outputs.TAG_NAME }} built from mxenc directory"
