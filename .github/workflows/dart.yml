name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    # 设置全局默认工作目录，这样后续的大部分步骤都不用重复写 working-directory
    defaults:
      run:
        working-directory: mxenc

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Get dependencies
        run: flutter pub get

      - name: Update Pods
        run: pod repo update
        working-directory: mxenc/ios # 注意：这里叠加了默认路径

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Prepare IPA
        # 这里的路径也需要根据 mxenc 目录层级调整
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app/ Payload
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # 确保文件路径指向 mxenc 下的构建结果
          file: mxenc/build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release from mxenc directory"
