name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    # 设置全局默认工作目录，这样后续的大部分步骤都不用重复写 working-directory
    defaults:
      run:
        working-directory: mxenc

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust core for iOS
        run: |
          chmod +x scripts/build_rust.sh
          ./scripts/build_rust.sh

      - name: Update Pods
        run: pod repo update
        working-directory: mxenc/ios

      - name: Build iOS
        run: |
          export FLUTTER_ROOT="$FLUTTER_ROOT"
          flutter build ios --release --no-codesign

      - name: Prepare IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app/ Payload
          zip -qq -r -9 MxEnc.ipa Payload

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: mxenc/build/ios/iphoneos/MxEnc.ipa
          tag: ${{ steps.get_version.outputs.TAG_NAME }}
          overwrite: true
          body: "Release ${{ steps.get_version.outputs.TAG_NAME }} built from mxenc directory"
