name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    # 设置全局默认工作目录，这样后续的大部分步骤都不用重复写 working-directory
    defaults:
      run:
        working-directory: mxenc

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust core for iOS
        run: |
          chmod +x scripts/build_rust.sh
          ./scripts/build_rust.sh

      - name: Verify symbols in Rust library
        run: |
          echo "=== 验证 Rust 静态库符号 ==="
          nm -g ios/libs/libmxenc_core.a | grep frb_get_rust_content_hash || echo "❌ frb_get_rust_content_hash NOT FOUND"
          nm -g ios/libs/libmxenc_core.a | grep store_dart_post_cobject || echo "❌ store_dart_post_cobject NOT FOUND"
          nm -g ios/libs/libmxenc_core.a | grep dummy_method_to_enforce_bundling || echo "❌ dummy_method_to_enforce_bundling NOT FOUND"
          # 必须存在，否则提前终止
          nm -g ios/libs/libmxenc_core.a | grep -q frb_get_rust_content_hash || exit 1

      - name: Update Pods
        run: pod repo update
        working-directory: mxenc/ios

      - name: Build iOS
        run: |
          export FLUTTER_ROOT="$FLUTTER_ROOT"
          flutter build ios --release --no-codesign

      - name: Verify symbols in iOS binary
        run: |
          echo "=== 验证最终 iOS 产物符号 ==="
          nm -g build/ios/iphoneos/Runner.app/Runner | grep frb_get_rust_content_hash || echo "❌ frb_get_rust_content_hash NOT FOUND"
          nm -g build/ios/iphoneos/Runner.app/Runner | grep store_dart_post_cobject || echo "❌ store_dart_post_cobject NOT FOUND"
          nm -g build/ios/iphoneos/Runner.app/Runner | grep dummy_method_to_enforce_bundling || echo "❌ dummy_method_to_enforce_bundling NOT FOUND"

      - name: Prepare IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app/ Payload
          zip -qq -r -9 "MxEnc_${{ steps.get_version.outputs.TAG_NAME }}.ipa" Payload

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: mxenc/build/ios/iphoneos/MxEnc_${{ steps.get_version.outputs.TAG_NAME }}.ipa
          asset_name: MxEnc_${{ steps.get_version.outputs.TAG_NAME }}.ipa
          tag: ${{ steps.get_version.outputs.TAG_NAME }}
          overwrite: true
          body: "Release ${{ steps.get_version.outputs.TAG_NAME }} built from mxenc directory"
