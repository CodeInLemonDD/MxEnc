[package]
name = "mxenc_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mxenc_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.10.3"
rand = "0.8.5"
zeroize = "1.6.0"
flutter_rust_bridge = "=2.11.1"
anyhow = "1.0.86"
thiserror = "1.0.69"
byteorder = "1.5.0"
pbkdf2 = { version = "0.12", default-features = false }
sha2 = "0.10"
hmac = "0.12"
